# Rebuilds the site from the live tours API every 3 hours, so tour pages,
# prices and the product sitemap stay current. Commits only when something
# changed, then updates the "deploy" branch that Hostinger pulls.
name: Refresh tours
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from the tours API
        run: python3 source/build.py
      - name: Commit and deploy if anything changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A public_html source/data/tour-slugs.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh tours from the API"
          git push origin HEAD:main
          git subtree split --prefix public_html -b deploy-new
          git push --force origin deploy-new:deploy
