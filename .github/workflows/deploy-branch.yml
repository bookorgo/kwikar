# Keeps the "deploy" branch = contents of public_html/.
# Hostinger pulls the "deploy" branch into public_html (auto-deploy webhook).
name: Update deploy branch
on:
  push:
    branches: [main]
    paths: ['public_html/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish public_html to the deploy branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix public_html -b deploy-new
          git push --force origin deploy-new:deploy
